<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Emerald banknote gradient -->
    <linearGradient id="cashGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Orange Bookmark & Trend Arrow Gradient (#FF6A00) -->
    <linearGradient id="orangeGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A34" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>

    <!-- Wallet Body Gradient (Dark Navy) -->
    <linearGradient id="walletGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="subtleShadowT" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Transparent Background Standalone Icon -->
  <g transform="translate(68, 64)" filter="url(#subtleShadowT)">
    <!-- 1. Background Emerging Cash / Note (Emerald Green) -->
    <g transform="rotate(-6 188 120)">
      <rect x="70" y="32" width="220" height="100" rx="18" fill="url(#cashGradT)" />
      <rect x="78" y="40" width="204" height="84" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" />
      <circle cx="180" cy="82" r="14" fill="#FFFFFF" fill-opacity="0.25" />
    </g>

    <!-- 2. Main Wallet Body (Dark Navy) -->
    <rect x="40" y="80" width="280" height="230" rx="36" fill="url(#walletGradT)" stroke="#334155" stroke-width="3" />

    <!-- 3. Memory Bookmark Ribbon (representing remembering expenses) -->
    <path d="M 66 70 L 112 70 L 112 170 L 89 150 L 66 170 Z" fill="url(#orangeGradT)" />
    <circle cx="89" cy="104" r="5" fill="#FFFFFF" />

    <!-- 4. Spending Bar Chart on Front of Wallet (White) -->
    <rect x="136" y="210" width="26" height="66" rx="8" fill="#F8FAFC" />
    <rect x="174" y="174" width="26" height="102" rx="8" fill="#F8FAFC" />
    <rect x="212" y="140" width="26" height="136" rx="8" fill="#F8FAFC" />

    <!-- 5. Dynamic Spending Growth Arrow (#FF6A00) -->
    <path d="M 124 204 L 164 168 L 198 184 L 250 114" fill="none" stroke="url(#orangeGradT)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 226 110 L 254 110 L 254 138" fill="none" stroke="url(#orangeGradT)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 6. Wallet Clasp / Flap (Right Side) -->
    <path d="M 280 150 L 336 150 C 354 150 366 162 366 180 C 366 198 354 210 336 210 L 280 210 Z" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <circle cx="334" cy="180" r="15" fill="#F1F5F9" />
    <circle cx="334" cy="180" r="7" fill="#94A3B8" />
  </g>
</svg>
